name: CI

on:
  push:
    branches: [main]
  # pull_request:
  #   branches: [main]

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build Lambda bundles
        run: npm run build

      # - name: Validate CloudFormation templates
      #   run: |
      #     aws cloudformation validate-template --template-body file://infra/artifacts.yaml
      #     aws cloudformation validate-template --template-body file://infra/template.yaml

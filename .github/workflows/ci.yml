name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000

    env:
      DYNAMODB_ENDPOINT: http://localhost:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Set up Python for cfn-lint
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run CloudFormation linter
        run: |
          pip install -q cfn-lint
          cfn-lint infra/core.yaml infra/template.yaml infra/nested/*.yaml infra/bootstrap/*.yaml

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Build Lambda bundles
        run: npm run build

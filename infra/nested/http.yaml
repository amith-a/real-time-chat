AWSTemplateFormatVersion: "2010-09-09"
Description: Real-Time Chat Application - HTTP REST API & Compute Stack

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
  ParentStackName:
    Type: String
    Description: Name of the parent CloudFormation stack for consistent resource naming
  ArtifactBucketName:
    Type: String
  UsersArtifactKey:
    Type: String
  MessagesArtifactKey:
    Type: String
  RoomsArtifactKey:
    Type: String

Resources:
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ParentStackName}-http-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 300

  HttpJwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      Name: CognitoJwtAuthorizer
      IdentitySource:
        - "$request.header.Authorization"
      JwtConfiguration:
        Audience:
          - Fn::ImportValue: !Sub "${Environment}-chat-user-pool-client-id"
        Issuer:
          Fn::ImportValue: !Sub "${Environment}-chat-user-pool-issuer"

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: !Ref Environment
      AutoDeploy: true

  UsersLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ParentStackName}-users"
      RetentionInDays: 3
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  UsersExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ParentStackName}-users-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

  UsersLoggingPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ParentStackName}-users-logging"
      Roles:
        - !Ref UsersExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !GetAtt UsersLogGroup.Arn
              - !Sub "${UsersLogGroup.Arn}:*"

  UsersDynamoDBPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ParentStackName}-users-dynamodb"
      Roles:
        - !Ref UsersExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:Query
            Resource:
              - Fn::ImportValue: !Sub "${Environment}-chat-table-arn"
              - Fn::ImportValue: !Sub "${Environment}-chat-table-index-arn"

  UsersFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - UsersLogGroup
      - UsersLoggingPolicy
      - UsersDynamoDBPolicy
    Properties:
      FunctionName: !Sub "${ParentStackName}-users"
      Runtime: nodejs22.x
      Handler: users.handler
      Timeout: 10
      Role: !GetAtt UsersExecutionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Ref UsersArtifactKey
      Environment:
        Variables:
          TABLE_NAME:
            Fn::ImportValue: !Sub "${Environment}-chat-table-name"
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  UsersHttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      PayloadFormatVersion: "2.0"
      IntegrationUri: !Sub
        - "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations"
        - FunctionArn: !GetAtt UsersFunction.Arn

  UsersInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt UsersFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/*"
        - ApiId: !Ref HttpApi

  ListUsersRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /users"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpJwtAuthorizer
      Target: !Sub "integrations/${UsersHttpIntegration}"
  
  GetMeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /users/me"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpJwtAuthorizer
      Target: !Sub "integrations/${UsersHttpIntegration}"

  GetUserRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /users/{userId}"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpJwtAuthorizer
      Target: !Sub "integrations/${UsersHttpIntegration}"

  MessagesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ParentStackName}-messages"
      RetentionInDays: 3
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  MessagesExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ParentStackName}-messages-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

  MessagesLoggingPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ParentStackName}-messages-logging"
      Roles:
        - !Ref MessagesExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !GetAtt MessagesLogGroup.Arn
              - !Sub "${MessagesLogGroup.Arn}:*"

  MessagesDynamoDBPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ParentStackName}-messages-dynamodb"
      Roles:
        - !Ref MessagesExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:Query
            Resource:
              - Fn::ImportValue: !Sub "${Environment}-chat-table-arn"
              - Fn::ImportValue: !Sub "${Environment}-chat-table-index-arn"

  MessagesFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - MessagesLogGroup
      - MessagesLoggingPolicy
      - MessagesDynamoDBPolicy
    Properties:
      FunctionName: !Sub "${ParentStackName}-messages"
      Runtime: nodejs22.x
      Handler: messages.handler
      Timeout: 10
      Role: !GetAtt MessagesExecutionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Ref MessagesArtifactKey
      Environment:
        Variables:
          TABLE_NAME:
            Fn::ImportValue: !Sub "${Environment}-chat-table-name"
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  MessagesHttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      PayloadFormatVersion: "2.0"
      IntegrationUri: !Sub
        - "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations"
        - FunctionArn: !GetAtt MessagesFunction.Arn

  MessagesInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt MessagesFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/*"
        - ApiId: !Ref HttpApi

  GetRoomMessagesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /rooms/{roomId}/messages"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpJwtAuthorizer
      Target: !Sub "integrations/${MessagesHttpIntegration}"

  RoomsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ParentStackName}-rooms"
      RetentionInDays: 3
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  RoomsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ParentStackName}-rooms-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

  RoomsLoggingPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ParentStackName}-rooms-logging"
      Roles:
        - !Ref RoomsExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !GetAtt RoomsLogGroup.Arn
              - !Sub "${RoomsLogGroup.Arn}:*"

  RoomsDynamoDBPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ParentStackName}-rooms-dynamodb"
      Roles:
        - !Ref RoomsExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:ConditionCheckItem
              - dynamodb:Query
            Resource:
              - Fn::ImportValue: !Sub "${Environment}-chat-table-arn"
              - Fn::ImportValue: !Sub "${Environment}-chat-table-index-arn"

  RoomsFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - RoomsLogGroup
      - RoomsLoggingPolicy
      - RoomsDynamoDBPolicy
    Properties:
      FunctionName: !Sub "${ParentStackName}-rooms"
      Runtime: nodejs22.x
      Handler: rooms.handler
      Timeout: 10
      Role: !GetAtt RoomsExecutionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Ref RoomsArtifactKey
      Environment:
        Variables:
          TABLE_NAME:
            Fn::ImportValue: !Sub "${Environment}-chat-table-name"
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  RoomsHttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      PayloadFormatVersion: "2.0"
      IntegrationUri: !Sub
        - "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations"
        - FunctionArn: !GetAtt RoomsFunction.Arn

  RoomsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt RoomsFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/*"
        - ApiId: !Ref HttpApi

  CreateRoomRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /rooms"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpJwtAuthorizer
      Target: !Sub "integrations/${RoomsHttpIntegration}"

  ListMyRoomsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /rooms"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpJwtAuthorizer
      Target: !Sub "integrations/${RoomsHttpIntegration}"

  GetRoomRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /rooms/{roomId}"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpJwtAuthorizer
      Target: !Sub "integrations/${RoomsHttpIntegration}"

  ListRoomMembersRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /rooms/{roomId}/members"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpJwtAuthorizer
      Target: !Sub "integrations/${RoomsHttpIntegration}"

  AddRoomMemberRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /rooms/{roomId}/members"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpJwtAuthorizer
      Target: !Sub "integrations/${RoomsHttpIntegration}"

  RemoveRoomMemberRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "DELETE /rooms/{roomId}/members/{userId}"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpJwtAuthorizer
      Target: !Sub "integrations/${RoomsHttpIntegration}"

Outputs:
  HttpApiId:
    Description: HTTP API ID
    Value: !Ref HttpApi

  HttpApiEndpoint:
    Description: HTTP API endpoint for user search and directory
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}"

  MessagesFunctionArn:
    Description: ARN of the Messages HTTP Lambda Function
    Value: !GetAtt MessagesFunction.Arn

  RoomsFunctionArn:
    Description: ARN of the Rooms HTTP Lambda Function
    Value: !GetAtt RoomsFunction.Arn

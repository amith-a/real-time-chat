AWSTemplateFormatVersion: "2010-09-09"
Description: Real-Time Chat Application - Root Nested Application Stack

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment (dev, prod)

  ArtifactBucketName:
    Type: String
    Description: S3 bucket name containing Lambda deployment artifacts

  AuthorizerArtifactKey:
    Type: String
    Description: S3 object key for authorizer Lambda zip artifact

  ConnectArtifactKey:
    Type: String
    Description: S3 object key for connect Lambda zip artifact

  DisconnectArtifactKey:
    Type: String
    Description: S3 object key for disconnect Lambda zip artifact

  DefaultArtifactKey:
    Type: String
    Description: S3 object key for default Lambda zip artifact

  SendMessageArtifactKey:
    Type: String
    Description: S3 object key for sendMessage Lambda zip artifact

  UsersArtifactKey:
    Type: String
    Description: S3 object key for users Lambda zip artifact

  MessagesArtifactKey:
    Type: String
    Description: S3 object key for messages Lambda zip artifact

  RoomsArtifactKey:
    Type: String
    Description: S3 object key for rooms Lambda zip artifact

Resources:
  WebSocketStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${ArtifactBucketName}.s3.${AWS::Region}.${AWS::URLSuffix}/templates/websocket.yaml"
      Parameters:
        Environment: !Ref Environment
        ParentStackName: !Ref "AWS::StackName"
        ArtifactBucketName: !Ref ArtifactBucketName
        AuthorizerArtifactKey: !Ref AuthorizerArtifactKey
        ConnectArtifactKey: !Ref ConnectArtifactKey
        DisconnectArtifactKey: !Ref DisconnectArtifactKey
        DefaultArtifactKey: !Ref DefaultArtifactKey
        SendMessageArtifactKey: !Ref SendMessageArtifactKey
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  HttpStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${ArtifactBucketName}.s3.${AWS::Region}.${AWS::URLSuffix}/templates/http.yaml"
      Parameters:
        Environment: !Ref Environment
        ParentStackName: !Ref "AWS::StackName"
        ArtifactBucketName: !Ref ArtifactBucketName
        UsersArtifactKey: !Ref UsersArtifactKey
        MessagesArtifactKey: !Ref MessagesArtifactKey
        RoomsArtifactKey: !Ref RoomsArtifactKey
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

Outputs:
  WebSocketApiId:
    Description: WebSocket API ID
    Value: !GetAtt WebSocketStack.Outputs.WebSocketApiId

  WebSocketEndpoint:
    Description: WebSocket endpoint for the deployed stage
    Value: !GetAtt WebSocketStack.Outputs.WebSocketEndpoint

  HttpApiEndpoint:
    Description: HTTP API endpoint for user search and directory
    Value: !GetAtt HttpStack.Outputs.HttpApiEndpoint

  AuthorizerFunctionArn:
    Description: ARN of the WebSocket Lambda Authorizer Function
    Value: !GetAtt WebSocketStack.Outputs.AuthorizerFunctionArn

  SendMessageFunctionArn:
    Description: ARN of the SendMessage Lambda Function
    Value: !GetAtt WebSocketStack.Outputs.SendMessageFunctionArn

  MessagesFunctionArn:
    Description: ARN of the Messages HTTP Lambda Function
    Value: !GetAtt HttpStack.Outputs.MessagesFunctionArn

  RoomsFunctionArn:
    Description: ARN of the Rooms HTTP Lambda Function
    Value: !GetAtt HttpStack.Outputs.RoomsFunctionArn

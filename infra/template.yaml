AWSTemplateFormatVersion: "2010-09-09"

Description: Real-Time Chat infrastructure

Parameters:
  Environment:
    Description: Deployment environment
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  ArtifactBucketName:
    Description: S3 bucket containing Lambda deployment artifacts
    Type: String

  AuthorizerArtifactKey:
    Description: S3 object key for the authorizer ZIP
    Type: String

  ConnectArtifactKey:
    Description: S3 object key for the Connect Lambda ZIP
    Type: String

  DisconnectArtifactKey:
    Description: S3 object key for the Disconnect Lambda ZIP
    Type: String

  DefaultArtifactKey:
    Description: S3 object key for the Default Lambda ZIP
    Type: String

  SendMessageArtifactKey:
    Description: S3 object key for the SendMessage Lambda ZIP
    Type: String

  UsersArtifactKey:
    Description: S3 object key for the Users HTTP Lambda ZIP
    Type: String

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${Environment}-real-time-chat-users"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireNumbers: true
          RequireLowercase: true
          RequireUppercase: true
      MfaConfiguration: "OFF"
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${Environment}-chat-web-client"
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO
      AccessTokenValidity: 60
      IdTokenValidity: 60
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes

  AuthorizerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Environment}-chat-authorizer"
      RetentionInDays: 3
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  AuthorizerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Environment}-chat-authorizer-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole
  AuthorizerFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - AuthorizerLogGroup
      - AuthorizerLoggingPolicy
    Properties:
      FunctionName: !Sub "${Environment}-chat-authorizer"
      Runtime: nodejs22.x
      Handler: authorizer.handler
      Timeout: 10
      Role: !GetAtt AuthorizerExecutionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Ref AuthorizerArtifactKey
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient

  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-websocket"
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WebSocketAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref WebSocketApi
      Name: !Sub "${AWS::StackName}-authorizer"
      AuthorizerType: REQUEST
      IdentitySource:
        - route.request.querystring.token
      AuthorizerUri: !Sub
        - "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations"
        - FunctionArn: !GetAtt AuthorizerFunction.Arn

  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt AuthorizerFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/authorizers/${AuthorizerId}"
        - ApiId: !Ref WebSocketApi
          AuthorizerId: !Ref WebSocketAuthorizer

  ConnectExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-connect-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole
  ConnectLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-connect"
      RetentionInDays: 3
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  ConnectFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - ConnectLogGroup
      - ConnectLoggingPolicy
      - ConnectDynamoDBPolicy
    Properties:
      FunctionName: !Sub "${AWS::StackName}-connect"
      Runtime: nodejs22.x
      Handler: connect.handler
      Timeout: 10
      Role: !GetAtt ConnectExecutionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Ref ConnectArtifactKey
      Environment:
        Variables:
          TABLE_NAME: !Ref ChatTable

  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !Sub
        - "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations"
        - FunctionArn: !GetAtt ConnectFunction.Arn

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !Sub
        - "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations"
        - FunctionArn: !GetAtt DisconnectFunction.Arn

  DefaultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !Sub
        - "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations"
        - FunctionArn: !GetAtt DefaultFunction.Arn

  SendMessageIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !Sub
        - "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations"
        - FunctionArn: !GetAtt SendMessageFunction.Arn

  ConnectInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt ConnectFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/$connect"
        - ApiId: !Ref WebSocketApi

  DisconnectInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt DisconnectFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/$disconnect"
        - ApiId: !Ref WebSocketApi

  DefaultInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt DefaultFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/$default"
        - ApiId: !Ref WebSocketApi

  SendMessageInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt SendMessageFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/sendMessage"
        - ApiId: !Ref WebSocketApi

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "$connect"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref WebSocketAuthorizer
      Target: !Sub "integrations/${ConnectIntegration}"

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "$disconnect"
      AuthorizationType: NONE
      Target: !Sub "integrations/${DisconnectIntegration}"

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "$default"
      AuthorizationType: NONE
      Target: !Sub "integrations/${DefaultIntegration}"

  SendMessageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "sendMessage"
      AuthorizationType: NONE
      Target: !Sub "integrations/${SendMessageIntegration}"
  
  SendMessageRouteResponse:
    Type: AWS::ApiGatewayV2::RouteResponse
    Properties:
      ApiId: !Ref WebSocketApi
      RouteId: !Ref SendMessageRoute
      RouteResponseKey: "$default"

  WebSocketDeploymentV2:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
      - ConnectRoute
      - ConnectIntegration
      - ConnectInvokePermission
      - DisconnectRoute
      - DisconnectIntegration
      - DisconnectInvokePermission
      - DefaultRoute
      - DefaultIntegration
      - DefaultInvokePermission
      - SendMessageRoute
      - SendMessageIntegration
      - SendMessageInvokePermission
      - SendMessageRouteResponse
    Properties:
      ApiId: !Ref WebSocketApi
      Description: "WebSocket API deployment v2"

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref Environment
      DeploymentId: !Ref WebSocketDeploymentV2

  DisconnectLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-disconnect"
      RetentionInDays: 3
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  DisconnectExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-disconnect-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
  DisconnectFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - DisconnectLogGroup
      - DisconnectLoggingPolicy
      - DisconnectDynamoDBPolicy
    Properties:
      FunctionName: !Sub "${AWS::StackName}-disconnect"
      Runtime: nodejs22.x
      Handler: disconnect.handler
      Timeout: 10
      Role: !GetAtt DisconnectExecutionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Ref DisconnectArtifactKey
      Environment:
        Variables:
          TABLE_NAME: !Ref ChatTable

  DefaultLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-default"
      RetentionInDays: 3
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  DefaultExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-default-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
  DefaultFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - DefaultLogGroup
      - DefaultLoggingPolicy
      - DefaultDynamoDBPolicy
      - DefaultManageConnectionsPolicy
    Properties:
      FunctionName: !Sub "${AWS::StackName}-default"
      Runtime: nodejs22.x
      Handler: default.handler
      Timeout: 20
      Role: !GetAtt DefaultExecutionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Ref DefaultArtifactKey
      Environment:
        Variables:
          TABLE_NAME: !Ref ChatTable
          API_GATEWAY_MANAGEMENT_ENDPOINT: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}"
    UpdateReplacePolicy: Delete

  SendMessageLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-send-message"
      RetentionInDays: 3
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  SendMessageExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-send-message-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

  SendMessageFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - SendMessageLogGroup
      - SendMessageLoggingPolicy
      - SendMessageDynamoDBPolicy
      - SendMessageManageConnectionsPolicy
    Properties:
      FunctionName: !Sub "${AWS::StackName}-send-message"
      Runtime: nodejs22.x
      Handler: sendMessage.handler
      Timeout: 20
      Role: !GetAtt SendMessageExecutionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Ref SendMessageArtifactKey
      Environment:
        Variables:
          TABLE_NAME: !Ref ChatTable
          API_GATEWAY_MANAGEMENT_ENDPOINT: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}"
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  ChatTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-chat-table"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  AuthorizerLoggingPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${Environment}-chat-authorizer-logging"
      Roles:
        - !Ref AuthorizerExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !GetAtt AuthorizerLogGroup.Arn
              - !Sub "${AuthorizerLogGroup.Arn}:*"

  ConnectLoggingPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-connect-logging"
      Roles:
        - !Ref ConnectExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !GetAtt ConnectLogGroup.Arn
              - !Sub "${ConnectLogGroup.Arn}:*"

  ConnectDynamoDBPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-connect-dynamodb"
      Roles:
        - !Ref ConnectExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
            Resource:
              - !GetAtt ChatTable.Arn

  DisconnectLoggingPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-disconnect-logging"
      Roles:
        - !Ref DisconnectExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !GetAtt DisconnectLogGroup.Arn
              - !Sub "${DisconnectLogGroup.Arn}:*"

  DisconnectDynamoDBPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-disconnect-dynamodb"
      Roles:
        - !Ref DisconnectExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
            Resource:
              - !GetAtt ChatTable.Arn

  DefaultLoggingPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-default-logging"
      Roles:
        - !Ref DefaultExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !GetAtt DefaultLogGroup.Arn
              - !Sub "${DefaultLogGroup.Arn}:*"

  DefaultDynamoDBPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-default-dynamodb"
      Roles:
        - !Ref DefaultExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:Query
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
            Resource:
              - !GetAtt ChatTable.Arn
              - !Sub "${ChatTable.Arn}/index/*"

  DefaultManageConnectionsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-default-manage-connections"
      Roles:
        - !Ref DefaultExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource:
              - !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/${Environment}/POST/@connections/*"

  SendMessageLoggingPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-send-message-logging"
      Roles:
        - !Ref SendMessageExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !GetAtt SendMessageLogGroup.Arn
              - !Sub "${SendMessageLogGroup.Arn}:*"

  SendMessageDynamoDBPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-send-message-dynamodb"
      Roles:
        - !Ref SendMessageExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:Query
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
            Resource:
              - !GetAtt ChatTable.Arn
              - !Sub "${ChatTable.Arn}/index/*"

  SendMessageManageConnectionsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-send-message-manage-connections"
      Roles:
        - !Ref SendMessageExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource:
              - !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/${Environment}/POST/@connections/*"

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-http-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 300

  HttpJwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      Name: CognitoJwtAuthorizer
      IdentitySource:
        - "$request.header.Authorization"
      JwtConfiguration:
        Audience:
          - !Ref UserPoolClient
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: !Ref Environment
      AutoDeploy: true

  UsersLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-users"
      RetentionInDays: 3
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  UsersExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-users-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

  UsersLoggingPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-users-logging"
      Roles:
        - !Ref UsersExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !GetAtt UsersLogGroup.Arn
              - !Sub "${UsersLogGroup.Arn}:*"

  UsersDynamoDBPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-users-dynamodb"
      Roles:
        - !Ref UsersExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:Query
            Resource:
              - !GetAtt ChatTable.Arn
              - !Sub "${ChatTable.Arn}/index/*"

  UsersFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - UsersLogGroup
      - UsersLoggingPolicy
      - UsersDynamoDBPolicy
    Properties:
      FunctionName: !Sub "${AWS::StackName}-users"
      Runtime: nodejs22.x
      Handler: users.handler
      Timeout: 10
      Role: !GetAtt UsersExecutionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Ref UsersArtifactKey
      Environment:
        Variables:
          TABLE_NAME: !Ref ChatTable
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  UsersHttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      PayloadFormatVersion: "2.0"
      IntegrationUri: !Sub
        - "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations"
        - FunctionArn: !GetAtt UsersFunction.Arn

  UsersInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt UsersFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/*"
        - ApiId: !Ref HttpApi

  ListUsersRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /users"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpJwtAuthorizer
      Target: !Sub "integrations/${UsersHttpIntegration}"
  
  GetMeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /users/me"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpJwtAuthorizer
      Target: !Sub "integrations/${UsersHttpIntegration}"

  GetUserRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /users/{userId}"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpJwtAuthorizer
      Target: !Sub "integrations/${UsersHttpIntegration}"

Outputs:
  UserPoolId:
    Description: ID of the created Cognito User Pool
    Value: !Ref UserPool

  UserPoolClientId:
    Description: ID of the created Cognito User Pool Client
    Value: !Ref UserPoolClient

  AuthorizerFunctionArn:
    Description: ARN of the WebSocket Lambda Authorizer Function
    Value: !GetAtt AuthorizerFunction.Arn

  SendMessageFunctionArn:
    Description: ARN of the SendMessage Lambda Function
    Value: !GetAtt SendMessageFunction.Arn

  WebSocketApiId:
    Description: WebSocket API ID
    Value: !Ref WebSocketApi

  WebSocketEndpoint:
    Description: WebSocket endpoint for the deployed stage
    Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}"

  HttpApiEndpoint:
    Description: HTTP API endpoint for user search and directory
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}"

  ChatTableName:
    Description: Name of the DynamoDB Chat Table
    Value: !Ref ChatTable

  ChatTableArn:
    Description: ARN of the DynamoDB Chat Table
    Value: !GetAtt ChatTable.Arn
